services:

  mongodb:
    image: mongo:8
    container_name: movie_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movie_app
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    depends_on:
      - mongodb

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: movie_airflow
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
    command: standalone
    depends_on:
      - mongodb

volumes:
  mongodb_data: